<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Profile</title>
</head>

<body>

    <h1>Student Profile</h1>

    <form method="POST" enctype="multipart/form-data">

        <!-- Personal Information -->
        <h2>Personal Information</h2>

        <label>Full Name:</label><br>
        <input type="text" name="name" required><br><br>

        <label>Email:</label><br>
        <input type="email" name="email" required><br><br>

        <label>Phone:</label><br>
        <input type="text" name="phone"><br><br>


        <!-- Education -->
        <h2>Education</h2>

        <label>Degree:</label><br>
        <input type="text" name="degree"><br><br>

        <label>College / University:</label><br>
        <input type="text" name="college"><br><br>

        <label>Graduation Year:</label><br>
        <input type="number" name="graduation_year"><br><br>


        <!-- Skills -->
        <h2>Skills</h2>

        <label>Technical Skills:</label><br>

        <textarea
            name="skills"
            rows="4"
            placeholder="Example: Python, SQL, Machine Learning">
        </textarea>

        <br><br>


        <!-- Experience -->
        <h2>Experience</h2>

        <label>Experience:</label><br>

        <textarea
            name="experience"
            rows="4"
            placeholder="Describe your work/internship experience">
        </textarea>

        <br><br>


        <!-- Projects -->
        <h2>Projects</h2>

        <label>Projects:</label><br>

        <textarea
            name="projects"
            rows="4"
            placeholder="Describe your projects">
        </textarea>

        <br><br>


        <!-- Certifications -->
        <h2>Certifications</h2>

        <label>Certifications:</label><br>

        <textarea
            name="certifications"
            rows="3"
            placeholder="Example: NPTEL, Infosys Springboard">
        </textarea>

        <br><br>


        <!-- Achievements -->
        <h2>Achievements</h2>

        <label>Achievements:</label><br>

        <textarea
            name="achievements"
            rows="3"
            placeholder="Enter your achievements">
        </textarea>

        <br><br>


        <!-- Resume Upload -->
        <h2>Resume</h2>

        <label>Upload Resume (PDF):</label><br>

        <input
            type="file"
            name="resume"
            accept=".pdf"
            required>

        <br><br>


        <!-- Submit -->
        <button type="submit">Create Profile</button>

    </form>

</body>

</html>
